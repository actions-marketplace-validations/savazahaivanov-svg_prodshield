name: ProdShield Pre-Flight Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run ProdShield Gatekeeper
        uses: ./
        with:
          dir: '.'
          format: 'markdown'
